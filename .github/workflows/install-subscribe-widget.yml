name: Install subscription widget loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-subscribe-widget.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add widget loader to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          tag = '  <script src="assets/subscribe-widget.js" defer></script>\n'
          if tag.strip() not in text:
              text = text.replace('</body>', tag + '</body>')
              p.write_text(text)
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Morning Edition subscription widget"
          git push
