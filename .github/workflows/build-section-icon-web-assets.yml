# Existing workflow re-saved to trigger the exact SVG web render build.
name: Build exact section icon web assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-section-icon-web-assets.yml'

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render exact uploaded SVG artwork for web
        run: |
          mkdir -p assets/section-icons/web
          for name in world science happy philosophy lightbulb box bookmark clock; do
            rsvg-convert --keep-aspect-ratio --width 220 --height 220 \
              "assets/section-icons/${name}.svg" \
              --output "assets/section-icons/web/${name}.png"
          done

      - name: Point section headers at web renders
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('assets/section-icons.js')
          text = js.read_text()
          for name in ['world','science','happy','philosophy','lightbulb','box','bookmark','clock']:
              text = text.replace(
                  f"assets/section-icons/{name}.svg",
                  f"assets/section-icons/web/{name}.png?v=20260826b"
              )
          js.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace(
              'assets/section-icons.js" defer',
              'assets/section-icons.js?v=20260826b" defer'
          )
          index.write_text(html)
          PY

      - name: Commit web assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/section-icons/web assets/section-icons.js index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use exact rendered section icon artwork"
          git push
